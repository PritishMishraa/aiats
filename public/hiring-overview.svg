  <text x="285" y="556" class="t" font-size="13" font-weight="700">Senior Backend Engineer, Platform Engineering</text><rect class="pill" x="570" y="541" width="66" height="19" rx="9"/><text x="579" y="554" class="t" font-size="9">published</text><text x="285" y="578" class="muted" font-size="11">Platform Engineering</text><text x="1140" y="566" class="t" font-size="12">2 candidates</text><text x="1250" y="566" class="green" font-size="12">0 strong fit</text><text x="1360" y="566" class="t" font-size="20">›</text></g>
  <rect class="card" x="265" y="618" width="1130" height="210" rx="16"/><text x="284" y="655" class="t" font-size="14" font-weight="700">Candidates to review</text><text x="1315" y="655" class="small" font-size="12">View queue</text><line class="line" x1="265" y1="675" x2="1395" y2="675"/>
  <g font-family="Arial,sans-serif"><text x="285" y="703" class="t" font-size="12" font-weight="700">Sahil Sahil</text><text x="285" y="722" class="muted" font-size="10">Software Engineer — Frontend / Full Stack</text><text x="1360" y="705" class="t" font-size="13" font-weight="700">88</text><text x="1302" y="722" class="muted" font-size="10">Interview Scheduled</text><line class="line" x1="265" y1="741" x2="1395" y2="741"/><text x="285" y="769" class="t" font-size="12" font-weight="700">Ari Tiwari</text><text x="285" y="788" class="muted" font-size="10">Junior Frontend Developer</text><text x="1360" y="771" class="t" font-size="13" font-weight="700">52</text><text x="1337" y="788" class="muted" font-size="10">Review</text><line class="line" x1="265" y1="807" x2="1395" y2="807"/></g>
</svg>
