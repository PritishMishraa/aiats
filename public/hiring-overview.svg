<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hireflow hiring overview dashboard</title>
  <desc id="desc">A light hiring dashboard showing role, candidate, match, and interview metrics with active jobs and candidate review lists.</desc>
  <defs>
    <style>
      .bg{fill:#f8f9fb}.line{stroke:#e7eaf0;stroke-width:1}.nav{fill:#fff}.card{fill:#fff;stroke:#e7eaf0;stroke-width:1}.t{font-family:Arial,sans-serif;fill:#11182b}.muted{font-family:Arial,sans-serif;fill:#8ca0bf}.small{font-family:Arial,sans-serif;fill:#677a99}.pill{fill:#f0f1f4}.green{fill:#159a70}.purple{fill:#654dff}.blue{fill:#009ae4}.orange{fill:#ef7c00}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <rect class="nav" width="60" height="900"/><line class="line" x1="60" y1="0" x2="60" y2="900"/>
  <rect class="nav" x="60" width="1540" height="52"/><line class="line" x1="60" y1="52" x2="1600" y2="52"/>
  <rect x="14" y="18" width="30" height="30" rx="8" fill="#080d20"/><path d="M31 23l-8 10h6l-1 8 9-11h-6z" fill="white"/>
  <g fill="#7d8eaa"><circle cx="30" cy="112" r="5"/><rect x="23" y="157" width="14" height="14" rx="3"/><rect x="23" y="202" width="14" height="11" rx="2"/><circle cx="27" cy="249" r="4"/><circle cx="34" cy="249" r="4"/><path d="M23 295l7-5 7 5-7 5zM23 301l7 5 7-5" fill="none" stroke="#7d8eaa" stroke-width="2"/><rect x="24" y="342" width="13" height="12" fill="none" stroke="#7d8eaa" stroke-width="2"/></g>
  <text x="1450" y="31" class="t" font-size="12">Careers</text><rect x="1507" y="12" width="74" height="28" rx="8" fill="#080d20"/><text x="1520" y="30" font-family="Arial,sans-serif" font-size="11" fill="white">Create job</text>
  <text x="265" y="95" class="muted" font-size="12">Live hiring workspace</text><text x="265" y="126" class="t" font-size="24" font-weight="700">Hiring overview</text><text x="265" y="151" class="small" font-size="14">Current data from your jobs and candidate pipeline.</text>
  <rect x="1270" y="118" width="125" height="35" rx="9" fill="#080d20"/><text x="1287" y="140" font-family="Arial,sans-serif" font-size="12" fill="white">✦ Generate a job</text>
  <g>
    <rect class="card" x="265" y="185" width="270" height="83" rx="16"/><text x="282" y="211" class="small" font-size="12">Open roles</text><text x="282" y="244" class="t" font-size="25" font-weight="700">3</text><rect x="485" y="200" width="33" height="33" rx="10" fill="#edf0ff"/><text x="496" y="222" class="purple" font-size="16">▣</text>
    <rect class="card" x="545" y="185" width="270" height="83" rx="16"/><text x="562" y="211" class="small" font-size="12">Total candidates</text><text x="562" y="244" class="t" font-size="25" font-weight="700">4</text><rect x="765" y="200" width="33" height="33" rx="10" fill="#eafbff"/><text x="776" y="222" class="blue" font-size="16">♟</text>
    <rect class="card" x="825" y="185" width="270" height="83" rx="16"/><text x="842" y="211" class="small" font-size="12">Strong matches</text><text x="842" y="244" class="t" font-size="25" font-weight="700">1</text><rect x="1045" y="200" width="33" height="33" rx="10" fill="#ebfff7"/><text x="1055" y="222" class="green" font-size="16">↗</text>
    <rect class="card" x="1105" y="185" width="290" height="83" rx="16"/><text x="1122" y="211" class="small" font-size="12">Interviews</text><text x="1122" y="244" class="t" font-size="25" font-weight="700">1</text><rect x="1345" y="200" width="33" height="33" rx="10" fill="#fff8e9"/><text x="1355" y="222" class="orange" font-size="16">▣</text>
  </g>
